[project]
name = "release-ready"
version = "0.1.0"
description = "Release Ready — can we ship? checklist engine (EveryTech AI engineer course)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[project.scripts]
release-ready = "release_ready.cli.main:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["release_ready*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
