[project]
name = "shipgate"
version = "0.1.0"
description = "Pre-ship checklist trainer for AI engineer curriculum"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[project.scripts]
shipgate = "shipgate.cli.main:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["shipgate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
